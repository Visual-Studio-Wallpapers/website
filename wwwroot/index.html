<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visual Studio Wallpapers</title>
    <base href="/" />
    
    <!-- Favicon configuration -->
    <link rel="apple-touch-icon" sizes="180x180" href="favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicons/favicon-16x16.png">
    <link rel="manifest" href="favicons/site.webmanifest">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- App styles -->
    <link href="css/app.css" rel="stylesheet" />
    <link href="VisualStudioWallpapers.styles.css" rel="stylesheet" />

    <!-- SEO Meta Tags -->
    <meta name="description" content="Beautiful wallpapers for your Desktop, Phone, and Watch - Visual Studio Wallpapers">
    <meta name="author" content="James Montemagno, Scott Hanselman">

    <!-- Open Graph defaults -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Visual Studio Wallpapers">
    <meta property="og:title" content="Visual Studio Wallpapers">
    <meta property="og:description" content="Beautiful wallpapers for your Desktop, Phone, and Watch">
    <meta property="og:url" content="https://visualstudiowallpapers.com">

    <!-- Twitter defaults -->
    <meta name="twitter:card" content="summary_large_image">
</head>
<body>
    <div id="app">
        <div style="text-align:center;padding:4rem 2rem;">
            <p>Loading...</p>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none;">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="js/theme-interop.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>

</html>
